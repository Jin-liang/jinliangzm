<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- 背景 -->
  <rect width="400" height="300" fill="#f5f5f5" rx="15" ry="15"/>
  
  <!-- 牙齿形状 -->
  <path d="M50,150 Q100,50 200,50 Q300,50 350,150 Q300,250 200,250 Q100,250 50,150 Z" fill="#ffffff" stroke="#dddddd" stroke-width="2"/>
  
  <!-- 上排牙齿 -->
  <path d="M80,150 Q100,100 130,100 Q160,100 180,150" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
  <path d="M180,150 Q200,100 220,100 Q240,100 260,150" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
  <path d="M260,150 Q280,100 300,100 Q320,100 340,150" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
  
  <!-- 下排牙齿 -->
  <path d="M80,150 Q100,200 130,200 Q160,200 180,150" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
  <path d="M180,150 Q200,200 220,200 Q240,200 260,150" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
  <path d="M260,150 Q280,200 300,200 Q320,200 340,150" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
  
  <!-- 标题 -->
  <text x="200" y="120" font-family="Arial" font-size="30" font-weight="bold" text-anchor="middle" fill="#4169e1" stroke="#000066" stroke-width="1">TITANS</text>
  <text x="200" y="180" font-family="Arial" font-size="36" font-weight="bold" text-anchor="middle" fill="#00bfff" stroke="#000066" stroke-width="1">CLINIC</text>
  
  <!-- 装饰元素 -->
  <circle cx="100" cy="80" r="10" fill="#4169e1" opacity="0.7"/>
  <circle cx="300" cy="80" r="10" fill="#4169e1" opacity="0.7"/>
  <circle cx="100" cy="220" r="10" fill="#00bfff" opacity="0.7"/>
  <circle cx="300" cy="220" r="10" fill="#00bfff" opacity="0.7"/>
</svg>
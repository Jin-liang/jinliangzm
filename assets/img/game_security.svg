<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- 背景 -->
  <rect width="400" height="300" fill="#1a1a2e" rx="15" ry="15"/>
  
  <!-- 霓虹灯效果 -->
  <rect x="50" y="50" width="300" height="80" rx="10" ry="10" fill="#16213e" stroke="#0099ff" stroke-width="3"/>
  <rect x="55" y="55" width="290" height="70" rx="8" ry="8" fill="none" stroke="#ff00cc" stroke-width="1" opacity="0.7"/>
  
  <!-- 标题文字 -->
  <text x="200" y="95" font-family="Arial" font-size="30" font-weight="bold" text-anchor="middle" fill="#00ffff" stroke="#ff00cc" stroke-width="1">I AM</text>
  <text x="200" y="130" font-family="Arial" font-size="36" font-weight="bold" text-anchor="middle" fill="#ff00cc" stroke="#00ffff" stroke-width="1">SECURITY</text>
  
  <!-- 人物剪影 -->
  <circle cx="200" cy="200" r="40" fill="#16213e" stroke="#0099ff" stroke-width="2"/>
  <path d="M180,180 Q200,160 220,180" stroke="#00ffff" stroke-width="2" fill="none"/>
  <rect x="185" y="190" width="30" height="15" rx="2" ry="2" fill="#ff00cc"/>
  
  <!-- 安全徽章 -->
  <rect x="260" y="190" width="80" height="30" rx="5" ry="5" fill="#16213e" stroke="#ffcc00" stroke-width="2"/>
  <text x="300" y="210" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffcc00">SECURITY</text>
  
  <!-- 装饰元素 -->
  <circle cx="100" cy="200" r="20" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.7"/>
  <circle cx="100" cy="200" r="15" fill="none" stroke="#ff00cc" stroke-width="1" opacity="0.7"/>
  <circle cx="100" cy="200" r="10" fill="none" stroke="#ffcc00" stroke-width="1" opacity="0.7"/>
</svg>
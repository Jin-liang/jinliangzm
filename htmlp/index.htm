<script>
// 中文补丁：替换位图字体为PIXI.Text（支持中文）
(function(){
    if (!window.PIXI || !PIXI.extras || !PIXI.extras.BitmapText) return;
    var Orig = PIXI.extras.BitmapText;
    PIXI.extras.BitmapText = function(text, style) {
        var fs = 44, tint = 0xFFFFFF, align = 'left';
        if (style && typeof style === 'object') {
            if (style.font) { var m = style.font.match(/(\d+)/); if (m) fs = parseInt(m[1]); }
            if (style.tint !== undefined) tint = style.tint;
            if (style.align) align = style.align;
        }
        var c = '#' + ('000000' + tint.toString(16)).slice(-6);
        PIXI.Text.call(this, text || '', {
            fontFamily: 'sans-serif', fontSize: fs || 44, fill: c, align: align, fontWeight: 'bold'
        });
    };
    PIXI.extras.BitmapText.prototype = Object.create(PIXI.Text.prototype);
    PIXI.extras.BitmapText.prototype.constructor = PIXI.extras.BitmapText;
    // 保留原始静态属性，防止字体注册失败
    PIXI.extras.BitmapText.fonts = {};
    for (var key in Orig) { if (Orig.hasOwnProperty(key)) PIXI.extras.BitmapText[key] = Orig[key]; }
    if (Orig.fonts) { for (var k in Orig.fonts) { PIXI.extras.BitmapText.fonts[k] = Orig.fonts[k]; } }
})();

// 音频补丁：处理损坏的音频文件，防止错误干扰游戏
(function(){
    if (!window.Howl) return;
    var OrigHowl = window.Howl;
    window.Howl = function(options) {
        options = options || {};
        // 静默处理音频加载错误，防止控制台刷屏
        options.onloaderror = options.onloaderror || function(id, err) {
            // 静默忽略，音频文件已损坏
        };
        options.onplayerror = options.onplayerror || function(id, err) {
            // 静默忽略
        };
        OrigHowl.call(this, options);
    };
    Howl.prototype = OrigHowl.prototype;
    Howl.prototype.constructor = Howl;
})();
</script>
